  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Web Audio Synthesizer for alerts
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playTone(freq, type, duration) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.value = freq || 440;
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      beep() { this.playTone(880, 'sine', 0.12); }
      warn() { this.playTone(440, 'triangle', 0.25); }
      siren() {
        this.playTone(660, 'sawtooth', 0.2);
        setTimeout(() => this.playTone(880, 'sawtooth', 0.25), 180);
      }
    }
    const sound = new SoundFX();

    const JAMMU_CENTER = [32.7300, 74.8600];

    const INITIAL_BUILDINGS = [

      { id: "BLD-02", name: "Talab Tillo Old Grain Silo", location: "Talab Tillo", lat: 32.7210, lng: 74.8350, age: 74, tilt: 0.5, crack: 1.2, vib: 0.18, risk: "GREEN", type: "Reinforced Concrete" },
      { id: "BLD-03", name: "Janipur Old Municipal Quarters", location: "Janipur", lat: 32.7530, lng: 74.8480, age: 62, tilt: 1.9, crack: 4.6, vib: 0.65, risk: "AMBER", type: "Unreinforced Masonry" },
      { id: "BLD-04", name: "Jewel Chowk Commercial Arcade", location: "Jewel Chowk", lat: 32.7250, lng: 74.8560, age: 48, tilt: 0.3, crack: 0.8, vib: 0.22, risk: "GREEN", type: "RCC Frame" },

      { id: "BLD-06", name: "Sanjay Nagar Primary School", location: "Sanjay Nagar", lat: 32.6980, lng: 74.8700, age: 55, tilt: 0.4, crack: 0.9, vib: 0.14, risk: "GREEN", type: "Brick Slab" },
      { id: "BLD-07", name: "Golepulli Canal Bridge Abutment", location: "Golepulli", lat: 32.7170, lng: 74.8210, age: 68, tilt: 1.1, crack: 2.4, vib: 0.35, risk: "GREEN", type: "Stone Arch" },
      { id: "BLD-08", name: "Roop Nagar Hillside Tower", location: "Roop Nagar", lat: 32.7650, lng: 74.8250, age: 32, tilt: 0.2, crack: 0.5, vib: 0.11, risk: "GREEN", type: "Modern RCC" },
      { id: "BLD-09", name: "Peer Kho Historic Vaults", location: "Old City", lat: 32.7360, lng: 74.8730, age: 180, tilt: 1.6, crack: 3.9, vib: 0.48, risk: "AMBER", type: "Ancient Vaults" },

    const INITIAL_DRAINS = [
      { id: "DR-01", name: "Talab Tillo Main Nullah Outfall", location: "Talab Tillo", lat: 32.7225, lng: 74.8280, level: 85, max: 220, flow: 4.2 },

      { id: "DR-03", name: "Jewel Chowk Sump Basin", location: "Jewel Chowk", lat: 32.7215, lng: 74.8550, level: 95, max: 180, flow: 3.6 },
      { id: "DR-04", name: "Golepulli Branch Canal", location: "Golepulli", lat: 32.7135, lng: 74.8230, level: 70, max: 240, flow: 6.1 },
      { id: "DR-05", name: "Sanjay Nagar Deep Storm Sewer", location: "Sanjay Nagar", lat: 32.6930, lng: 74.8690, level: 78, max: 190, flow: 2.9 },
      { id: "DR-06", name: "Roop Nagar Ridge Drainage", location: "Roop Nagar", lat: 32.7710, lng: 74.8180, level: 65, max: 210, flow: 4.8 },
      { id: "DR-07", name: "Tawi Promenade Interceptor", location: "Tawi Bank", lat: 32.7290, lng: 74.8690, level: 130, max: 300, flow: 14.5 },
      { id: "DR-08", name: "Bahu Fort Gully Runoff Basin", location: "Bahu Fort", lat: 32.7260, lng: 74.8850, level: 52, max: 160, flow: 2.1 }
    ];

    const SPONGE_ZONES = [
      { id: "SZ-01", name: "Talab Tillo Rain Garden Park", lat: 32.7260, lng: 74.8300, normalHrs: 7.5, spongeHrs: 0.8, type: "Bioswale Corridor" },
      { id: "SZ-02", name: "Jewel Chowk Permeable Aquifer Pit", lat: 32.7245, lng: 74.8530, normalHrs: 6.2, spongeHrs: 1.1, type: "Aquifer Recharge Pit" },
      { id: "SZ-03", name: "Janipur Valley Retention Buffer", lat: 32.7540, lng: 74.8400, normalHrs: 8.0, spongeHrs: 1.4, type: "Engineered Bioswale" },
      { id: "SZ-04", name: "Sanjay Nagar Green Detention Pond", lat: 32.6960, lng: 74.8670, normalHrs: 9.2, spongeHrs: 1.2, type: "Retention Wetland" }
    ];

    function App() {
      const [fireNodes, setFireNodes] = useState(INITIAL_FIRE_NODES);
      const [buildings, setBuildings] = useState(INITIAL_BUILDINGS);
      const [drains, setDrains] = useState(INITIAL_DRAINS);
      const [spongeActive, setSpongeActive] = useState(true);
      const [selectedLang, setSelectedLang] = useState('EN');
      const [soundMuted, setSoundMuted] = useState(false);
      const [activeTab, setActiveTab] = useState('fire');
      const [alerts, setAlerts] = useState([
        { id: 1, title: "Edge AI Guard Active", desc: "LoRaWAN gateway heartbeat online across 7 sectors.", shield: "ALL", risk: "GREEN", time: "Just now", verified: true },
        { id: 2, title: "Heritage Vibration Sensor Online", desc: "Mubarak Mandi Palace BLD-01 report: Ambient 0.42 mm/s² within buffer.", shield: "STRUCTURE", risk: "AMBER", time: "25s ago", verified: true }
      ]);
      const [activeRoute, setActiveRoute] = useState(null);
      const [showOpsModal, setShowOpsModal] = useState(false);
      const [showCrackModal, setShowCrackModal] = useState(false);
      const [showSmsModal, setShowSmsModal] = useState(false);
      const [showArchModal, setShowArchModal] = useState(false);
      const [showPublishModal, setShowPublishModal] = useState(false);
      const [selectedNode, setSelectedNode] = useState(null);
      const [autoScenarioCaption, setAutoScenarioCaption] = useState(null);
      const [timeStr, setTimeStr] = useState(new Date().toLocaleTimeString());
      const [toastMsg, setToastMsg] = useState(null);
      const [pwaPrompt, setPwaPrompt] = useState(null);

      const mapRef = useRef(null);
      const leafletMap = useRef(null);
      const markersLayer = useRef(null);
      const routeLayer = useRef(null);

      // PWA install prompt handler
      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setPwaPrompt(e);
        });
      }, []);

      const installPwa = () => {
        if (pwaPrompt) {
          pwaPrompt.prompt();
          pwaPrompt.userChoice.then(() => setPwaPrompt(null));
        } else {
          showToast("PWA: You can install via your browser menu ('Add to Home Screen')");
        }
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // Live clock
      useEffect(() => {
        const timer = setInterval(() => setTimeStr(new Date().toLocaleTimeString()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Initialize Leaflet
      useEffect(() => {
        if (!mapRef.current || leafletMap.current) return;

        const map = L.map(mapRef.current, {
          center: JAMMU_CENTER,
          zoom: 13,
          zoomControl: false
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          maxZoom: 19
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        markersLayer.current = L.layerGroup().addTo(map);
        routeLayer.current = L.layerGroup().addTo(map);
        leafletMap.current = map;

        return () => map.remove();
      }, []);

      // Draw Markers
      useEffect(() => {
        if (!leafletMap.current || !markersLayer.current) return;
        markersLayer.current.clearLayers();

        if (spongeActive) {
          SPONGE_ZONES.forEach(sz => {
            const circle = L.circle([sz.lat, sz.lng], {
              radius: 420,
              color: '#00E676',
              fillColor: '#00E676',
              fillOpacity: 0.18,
              weight: 1.5,
              dashArray: '5, 5'
            });
            circle.bindPopup(`<b>${sz.name}</b><br/>Type: ${sz.type}<br/>Waterlogging reduced from ${sz.normalHrs}h to ${sz.spongeHrs}h (-85%)`);
            markersLayer.current.addLayer(circle);
          });
        }

        fireNodes.forEach(fn => {
          const color = fn.alert ? '#FF3D00' : '#FF9100';
          const icon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background:${color}; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 10px ${color}"></div>`,
            iconSize: [16, 16]
          });
          const marker = L.marker([fn.lat, fn.lng], { icon });
          marker.on('click', () => { sound.beep(); setSelectedNode(fn); });
          markersLayer.current.addLayer(marker);
        });

        buildings.forEach(bld => {
          const color = bld.risk === 'RED' ? '#FF3D00' : bld.risk === 'AMBER' ? '#FFB300' : '#00E676';
          const icon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background:${color}; width:14px; height:14px; border:2px solid black; transform:rotate(45deg); box-shadow:0 0 8px ${color}"></div>`,
            iconSize: [14, 14]
          });
          const marker = L.marker([bld.lat, bld.lng], { icon });
          marker.on('click', () => { sound.beep(); setSelectedNode(bld); });
          markersLayer.current.addLayer(marker);
        });

        drains.forEach(dr => {
          const isRisk = (dr.level / dr.max) >= 0.70;
          const color = isRisk ? '#FF3D00' : '#2979FF';
          const icon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background:${color}; width:12px; height:12px; border-radius:50%; border:1.5px solid white;"></div>`,
            iconSize: [12, 12]
          });
          const marker = L.marker([dr.lat, dr.lng], { icon });
          marker.on('click', () => { sound.beep(); setSelectedNode(dr); });
          markersLayer.current.addLayer(marker);
        });
      }, [fireNodes, buildings, drains, spongeActive]);

      // Draw Emergency Route
      useEffect(() => {
        if (!routeLayer.current) return;
        routeLayer.current.clearLayers();

        if (activeRoute) {
          const latlngs = [
            [32.7050, 74.8580],
            [32.7150, 74.8560],
            [activeRoute.lat, activeRoute.lng]
          ];
          const polyline = L.polyline(latlngs, {
            color: '#FF3D00',
            weight: 4,
            dashArray: '8, 8',
            opacity: 0.95
          });
          routeLayer.current.addLayer(polyline);
        }
      }, [activeRoute]);

      // Telemetry Simulation Loop
      useEffect(() => {
        const interval = setInterval(() => {
          setFireNodes(prev => prev.map(fn => fn.alert ? fn : {
            ...fn,
            temp: +(fn.temp + (Math.random() - 0.48) * 0.4).toFixed(1),
            smoke: +(fn.smoke + (Math.random() - 0.48) * 0.8).toFixed(1),
            gas: +(fn.gas + (Math.random() - 0.48) * 0.6).toFixed(1)
          }));
          setDrains(prev => prev.map(dr => {
            const nextLvl = Math.min(dr.max * 0.95, Math.max(40, +(dr.level + (Math.random() - 0.5) * 1.5).toFixed(1)));
            return { ...dr, level: nextLvl };
          }));
        }, 2500);
        return () => clearInterval(interval);
      }, []);

      // Handlers
      const triggerFire = () => {
        sound.siren();
        const target = fireNodes[0];
        setFireNodes(prev => prev.map((f, i) => i === 0 ? { ...f, temp: 79.2, smoke: 410, gas: 140, alert: true } : f));
        setActiveRoute({ lat: target.lat, lng: target.lng, station: "Gandhi Nagar Fire Brigade", eta: 180 });
        setAlerts(prev => [{
          id: Date.now(),
          title: `🔥 CRITICAL FIRE ALERT: ${target.location}`,
          desc: "High thermal spike (79.2°C). Edge AI verified (false alarm filtered). Rapid brigade en route.",
          shield: "FIRE",
          risk: "RED",
          time: "Just now",
          verified: true
        }, ...prev]);
        setShowSmsModal(true);
      };

      const simulateRain = () => {
        sound.warn();
        setDrains(prev => prev.map(d => ({ ...d, level: Math.min(d.max * 0.94, d.level + 75) })));
        setBuildings(prev => prev.map(b => b.risk === 'AMBER' ? { ...b, risk: 'RED', tilt: b.tilt + 0.4 } : b));
        setAlerts(prev => [{
          id: Date.now(),
          title: "🌧️ MONSOON SURGE & FLOOD WARNING",
          desc: "Drainage exceeded 70% threshold. Soil saturation escalated Amber buildings to Red.",
          shield: "WATER",
          risk: "RED",
          time: "Just now",
          verified: true
        }, ...prev]);
      };

      const simulateTremor = () => {
        sound.siren();
        setBuildings(prev => prev.map(b => ({
          ...b,
          vib: +(b.vib + 1.8).toFixed(2),
          tilt: +(b.tilt + 0.5).toFixed(1),
          risk: "RED"
        })));
        setAlerts(prev => [{
          id: Date.now(),
          title: "⚠️ SEISMIC ACCELERATION ALERT",
          desc: "Tremor peak (2.4 mm/s²). Mubarak Mandi Palace & heritage structures alerted.",
          shield: "STRUCTURE",
          risk: "RED",
          time: "Just now",
          verified: true
        }, ...prev]);
        setShowSmsModal(true);
      };

      const resetAll = () => {
        sound.beep();
        setFireNodes(INITIAL_FIRE_NODES);
        setBuildings(INITIAL_BUILDINGS);
        setDrains(INITIAL_DRAINS);
        setActiveRoute(null);
        setAutoScenarioCaption(null);
        setAlerts(prev => [{
          id: Date.now(),
          title: "System Baseline Restored",
          desc: "All active hazards resolved. Telemetry normalized to operational baseline.",
          shield: "ALL",
          risk: "GREEN",
          time: "Just now",
          verified: true
        }, ...prev]);
      };

      const startAutoScenario = () => {
        resetAll();
        setAutoScenarioCaption("Step 1/5: Jammu Rakshak baseline operational across 7 city sectors.");
        setTimeout(() => {
          triggerFire();
          setAutoScenarioCaption("Step 2/5: 🔥 FIRE ALERT at Jewel Chowk! Edge AI verified. Unit dispatched with ETA.");
        }, 10000);
        setTimeout(() => {
          simulateRain();
          setAutoScenarioCaption("Step 3/5: 🌧️ MONSOON SURGE: Drains reached 85% capacity. Sponge zones absorbing runoff.");
        }, 22000);
        setTimeout(() => {
          simulateTremor();
          setAutoScenarioCaption("Step 4/5: ⚠️ SEISMIC ACCELERATION: Heritage masonry tilt increases. Red alert fired.");
        }, 36000);
        setTimeout(() => {
          setAutoScenarioCaption("Step 5/5: 🚨 INTER-AGENCY DISPATCH: Broadcast sent in Dogri, Hindi, Urdu & English.");
        }, 48000);
        setTimeout(() => {
          setAutoScenarioCaption("✅ Resilience Scenario Complete: All 3 shields fully operational.");
        }, 58000);
      };

      // Export Situation Report (SitRep)
      const exportSitRep = () => {
        sound.beep();
        const sitrep = {
          title: "Jammu Rakshak Situational Report (SitRep)",
          generatedAt: new Date().toISOString(),
          hackathon: "Jammu Smart City Hackathon 2026",
          theme: "Theme 06: Urban Resilience & Disaster Management",
          team: "ENDLIFERZ",
          fireAlerts: fireNodes.filter(f => f.alert),
          buildingRiskSummary: {
            red: buildings.filter(b => b.risk === 'RED').length,
            amber: buildings.filter(b => b.risk === 'AMBER').length,
            green: buildings.filter(b => b.risk === 'GREEN').length
          },
          drainsAtRisk: drains.filter(d => (d.level / d.max) >= 0.70),
          recentIncidents: alerts.slice(0, 5)
        };
        const blob = new Blob([JSON.stringify(sitrep, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Jammu_Rakshak_SitRep_${Date.now()}.json`;
        a.click();
        showToast("✓ Situational Report downloaded successfully!");
      };

      // Share live URL
      const shareDashboard = () => {
        sound.beep();
        if (navigator.share) {
          navigator.share({
            title: "Jammu Rakshak — Resilience Command Dashboard",
            text: "Jammu Smart City Hackathon (Theme 06: Urban Resilience & Disaster Management) by Team ENDLIFERZ",
            url: window.location.href
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("✓ Live Dashboard link copied to clipboard!");
        }
      };

      // Toggle fullscreen
      const toggleFullscreen = () => {
        sound.beep();
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen();
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-cyberDark">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-4 right-4 z-[2000] bg-neonEmerald text-black font-black text-xs px-4 py-2.5 rounded-lg shadow-2xl border border-white">
              {toastMsg}
            </div>
          )}

          {/* Top Bar */}

                  <p>✓ Fire & Emergency Services: Rapid response vehicle dispatched</p>
                  <p>✓ JMC Chief Engineers: Structural engineering team alerted</p>
                  <p>✓ SDMA: Perimeter safety advisory broadcasted</p>
                  <p>✓ Traffic Police Jammu: Priority green corridor active</p>
                </div>
                <button onClick={() => setShowSmsModal(false)} className="w-full py-2 bg-cyberElevated text-slate-200 font-bold rounded hover:bg-slate-700 transition">
                  ACKNOWLEDGE & CLOSE
                </button>
              </div>
            </div>
          )}

          {/* Modal: Architecture */}
          {showArchModal && (
            <div className="fixed inset-0 z-[1000] bg-black/70 flex items-center justify-center p-4">
              <div className="bg-cyberNavy border border-neonCyan rounded-xl max-w-md w-full p-5 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-black text-neonCyan tracking-wider text-sm">SYSTEM ARCHITECTURE</h3>
                  <button onClick={() => setShowArchModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-slate-300 font-bold">Sensors (LoRaWAN) → MQTT → API → AI Engine → Dashboard → Alerts</p>
                <div className="bg-cyberCard p-3 rounded text-xs space-y-1 text-slate-300 border border-cyberBorder">
                  <p>1. <b>LoRaWAN Mesh</b>: DHT22, MQ-2, MPU6050, Ultrasonic depth sensors</p>
                  <p>2. <b>MQTT Gateways</b>: Transmits edge telemetry frames every 2-3s</p>
                  <p>3. <b>Spatial Risk Engine</b>: Multi-hazard matrix calculations</p>
                  <p>4. <b>Gemini 3.5 Flash AI</b>: Forensic crack vision & false-alarm filtration</p>
                  <p>5. <b>Jammu Rakshak Dashboard</b>: Unified 3-shield command center</p>
                  <p>6. <b>Multi-Agency SMS</b>: Dogri, Hindi, Urdu & English citizen alerts</p>
                </div>
                <div className="text-right">
                  <button onClick={() => setShowArchModal(false)} className="px-4 py-1.5 bg-neonCyan text-black font-bold rounded hover:bg-cyan-300 transition text-xs">
                    CLOSE
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
